# Managed ARTEX stack for the dsh-artex plugin.
#
# The plugin runs:
#   docker compose -f docker/compose.yml -p <project> up -d --build
# with ARTEX_DIR pointing at an ARTEX checkout. Building locally is deliberate:
# the upstream project does not publish a prebuilt image.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?dsh-artex generates POSTGRES_PASSWORD}
      POSTGRES_DB: artex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  artex:
    build:
      context: ${ARTEX_DIR:?set artexDir to the ARTEX checkout}
    image: ${ARTEX_IMAGE:-dsh-artex:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@postgres:5432/artex?sslmode=disable
      ARTEX_JWT_KEY_DIR: /app/keys
      ARTEX_SECRET_KEY: ${ARTEX_SECRET_KEY:-}
      ARTEX_TASK_BUDGET_TOKENS: ${ARTEX_TASK_BUDGET_TOKENS:-}
      ARTEX_TASK_BUDGET_TURNS: ${ARTEX_TASK_BUDGET_TURNS:-}
      ARTEX_NOISE_PROFILE: ${ARTEX_NOISE_PROFILE:-}
      ARTEX_TARGET_USER_AGENT: ${ARTEX_TARGET_USER_AGENT:-}
    ports:
      - "127.0.0.1:${ARTEX_PORT:-8787}:8787"
      - "127.0.0.1:${ARTEX_PROXY_PORT:-8788}:8788"
    volumes:
      - data:/app/data
      - keys:/app/keys
    restart: unless-stopped

volumes:
  pgdata:
  data:
  keys:
