name: Bug report
description: Report a reproducible problem with dsh-artex
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include JWTs, admin passwords, LLM API keys,
        target credentials or private target addresses. Security vulnerabilities
        must be reported privately via SECURITY.md.

  - type: input
    id: version
    attributes:
      label: dsh-artex version / commit
      placeholder: "0.15.0 or git SHA"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: ARTEX runtime
      options:
        - external
        - docker
        - binary
        - not applicable / UI only
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, DSH version, ARTEX version/commit
      placeholder: "Windows 11, Node 24.18, DSH 0.2.2-rc.5, ARTEX main@abc1234"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs / screenshots
      description: Remove secrets, tokens, private hostnames and personal paths.
      render: text

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I removed secrets and private target information from this report.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
